plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.ego.launcher'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.ego.launcher"
        minSdk = 28
        targetSdk = 36
        versionCode = 1
        versionName = "1.0"

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
            }
        }
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }
}